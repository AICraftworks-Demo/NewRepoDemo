version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
    volumes:
      - demo_data:/app/src/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:4000
    ports:
      - '3000:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  demo_data:
